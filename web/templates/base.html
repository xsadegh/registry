{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="3">{{end}}
<title>{{.Title}}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v={{.Version}}">
<script src="/static/app.js?v={{.Version}}" defer></script>
</head>
<body>
{{template "content" .}}
</body>
</html>{{end}}

{{define "auth-brand"}}
<div class="auth-brand">
  <span class="logo">{{icon "box" 17}}</span>
  <div><b>Registry</b><small>{{.Host}}</small></div>
</div>
{{end}}
