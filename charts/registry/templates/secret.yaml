{{- if and (eq (include "registry.s3" .) "true") (not .Values.s3.existingSecret) .Values.s3.accessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.fullname" . }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.s3.accessKey | quote }}
  secretKey: {{ required "s3.secretKey is required when s3.accessKey is set" .Values.s3.secretKey | quote }}
{{- end }}
