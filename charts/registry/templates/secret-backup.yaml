{{- if and (eq (include "registry.backup" .) "true") (not .Values.backup.existingSecret) .Values.backup.accessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.backupSecret" . }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.backup.accessKey | quote }}
  secretKey: {{ required "backup.secretKey is required when backup.accessKey is set" .Values.backup.secretKey | quote }}
{{- end }}
